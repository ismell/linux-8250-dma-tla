SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Capacity = 2
    MaxTransfers = 2
    MaxWrites = 2
    MaxFlushes = 1
    MaxTerminateRetries = 2
    DrainCallbacksOnSync = TRUE
    AsyncHardwareStop = TRUE
    CheckTxRunning = TRUE
    CheckTxCookieStatus = FALSE
    FlushWakesWriteWaitDirectly = TRUE
    Patch6RetryOnTerminateFailure = TRUE
    QuarantineOnTerminateFailure = TRUE
    AllowClose = TRUE
    AllowTerminateFailure = TRUE
    AllowReopen = TRUE
    ReopenFallbackToPio = FALSE
INVARIANTS
    TypeOK
    NoBufferAliasing
    FifoAccounting
    NoUsersAtFree
    NoLostFlushWaiterWakeup
    BoundedTerminateRetries
    NoConcurrentFifoAccess
    QuarantineImpliesXmitBlocked
PROPERTIES
    ReservationProgress
    ShutdownProgress
